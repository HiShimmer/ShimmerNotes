<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Notes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css" />
    <link rel="stylesheet" href="_media/site.css" />
  </head>
  <body class="sidebar-toggle-hamburger">
    <div id="app">欢迎来到Shimmer的Zone，加载中...</div>
    <script>
      window.$docsify = {
        name: "A Notes",
        repo: "HiShimmer/ShimmerNotes",
        homepage: "README.md",
        relativePath: true,
        loadSidebar: true,
        loadNavbar: true,
        subMaxLevel: 2,
        sidebarDisplayLevel: 1,
        auto2top: true,
        search: "auto",
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
          "/.*/_navbar.md": "/_navbar.md",
        },
        coverpage: true,
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
    <script src="_media/site.js"></script>
  </body>
</html>
